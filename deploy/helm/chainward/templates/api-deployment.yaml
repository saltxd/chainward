apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "chainward.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api
    spec:
      {{- include "chainward.podSecurity" . | nindent 6 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ .Values.images.api }}
          {{- include "chainward.containerSecurity" . | nindent 10 }}
          ports:
            - containerPort: {{ .Values.api.port }}
          envFrom:
            - configMapRef:
                name: chainward-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecret }}
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecret }}
                  key: JWT_SECRET
            - name: ALCHEMY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecret }}
                  key: ALCHEMY_API_KEY
            - name: BASE_RPC_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecret }}
                  key: BASE_RPC_URL
            - name: BASE_RPC_FALLBACK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecret }}
                  key: BASE_RPC_FALLBACK_URL
                  optional: true
            - name: CHAIN_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecret }}
                  key: CHAIN_PROVIDER
                  optional: true
            - name: ALCHEMY_WEBHOOK_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecret }}
                  key: ALCHEMY_WEBHOOK_SIGNING_KEY
                  optional: true
            - name: ALCHEMY_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecret }}
                  key: ALCHEMY_AUTH_TOKEN
                  optional: true
            - name: ALCHEMY_WEBHOOK_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecret }}
                  key: ALCHEMY_WEBHOOK_ID
                  optional: true
            # Paid Intel Brief — receiving wallet + order ping. Both optional:
            # if TREASURY is unset, /api/brief/config reports available:false and
            # the checkout stays safely disabled.
            - name: TREASURY_WALLET_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecret }}
                  key: TREASURY_WALLET_ADDRESS
                  optional: true
            - name: DIGEST_DISCORD_WEBHOOK
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecret }}
                  key: DIGEST_DISCORD_WEBHOOK
                  optional: true
            # Coinbase CDP x402 facilitator (optional). When both are set the API
            # settles through CDP first, which lists the paid routes in the x402
            # Bazaar; PayAI stays the fallback. Startup-time fallback only; a CDP
            # outage after startup needs a pod restart.
            - name: CDP_API_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecret }}
                  key: CDP_API_KEY_ID
                  optional: true
            - name: CDP_API_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecret }}
                  key: CDP_API_KEY_SECRET
                  optional: true
            # x402 seller check RPCs (optional). alchemy_getAssetTransfers is
            # Alchemy-only, so both must be Alchemy URLs. Unset, Base uses
            # BASE_RPC_URL and BNB Chain is derived from the Base URL
            # (base-mainnet -> bnb-mainnet, same key).
            - name: SELLER_DEMAND_RPC_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecret }}
                  key: SELLER_DEMAND_RPC_URL
                  optional: true
            - name: SELLER_DEMAND_BSC_RPC_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecret }}
                  key: SELLER_DEMAND_BSC_RPC_URL
                  optional: true
            - name: BRIEF_PRICE_MICRO_USDC
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecret }}
                  key: BRIEF_PRICE_MICRO_USDC
                  optional: true
            - name: OPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecret }}
                  key: OPS_API_KEY
                  optional: true
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          readinessProbe:
            httpGet:
              path: /livez
              port: {{ .Values.api.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: {{ .Values.api.port }}
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "chainward.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.api.port }}
      targetPort: {{ .Values.api.port }}
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: api
