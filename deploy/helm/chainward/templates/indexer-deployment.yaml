apiVersion: apps/v1
kind: Deployment
metadata:
  name: indexer
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "chainward.labels" . | nindent 4 }}
    app.kubernetes.io/component: indexer
spec:
  replicas: {{ .Values.indexer.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/component: indexer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: indexer
    spec:
      {{- include "chainward.podSecurity" . | nindent 6 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: indexer
          image: {{ .Values.images.indexer }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          {{- include "chainward.containerSecurity" . | nindent 10 }}
          envFrom:
            - configMapRef:
                name: chainward-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecret }}
                  key: DATABASE_URL
            - name: ALCHEMY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecret }}
                  key: ALCHEMY_API_KEY
            # Public Base RPC for the indexer's own reads (the api keeps the Alchemy URL from the secret).
            - name: BASE_RPC_URL
              value: {{ .Values.indexer.baseRpcUrl | quote }}
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecret }}
                  key: TELEGRAM_BOT_TOKEN
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecret }}
                  key: JWT_SECRET
            - name: ALCHEMY_WEBHOOK_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecret }}
                  key: ALCHEMY_WEBHOOK_SIGNING_KEY
            - name: ALCHEMY_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecret }}
                  key: ALCHEMY_AUTH_TOKEN
            - name: ALCHEMY_WEBHOOK_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecret }}
                  key: ALCHEMY_WEBHOOK_ID
            - name: BASE_RPC_FALLBACK_URL
              value: {{ .Values.indexer.baseRpcFallbackUrl | quote }}
            {{- with .Values.riskSelfFlagAllowlist }}
            - name: RISK_SELF_FLAG_ALLOWLIST
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.sentinelRpc }}
            - name: SENTINEL_RPC
              value: {{ . | quote }}
            {{- end }}
            # ChainWard Attest signer (workers/riskAttest.ts). Absent = attesting off.
            - name: ATTEST_SIGNER_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecret }}
                  key: ATTEST_SIGNER_PRIVATE_KEY
                  optional: true
            # x402 seller board: alchemy_getAssetTransfers needs the Alchemy URL the api uses.
            - name: SELLER_DEMAND_RPC_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecret }}
                  key: BASE_RPC_URL
                  optional: true
            # TermiX provider (workers/termixProvider.ts, docs/termix-provider.md). Runs only
            # with the flag on AND the key present; the key must own ERC-8004 agent 365669
            # on BSC (today the treasury EOA) and pays the gas for accept / deliver / claim.
            - name: TERMIX_PROVIDER_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.externalSecret }}
                  key: TERMIX_PROVIDER_PRIVATE_KEY
            - name: TERMIX_PROVIDER_ENABLED
              value: {{ .Values.termixProvider.enabled | quote }}
            - name: TERMIX_MAX_JOBS_PER_RUN
              value: {{ .Values.termixProvider.maxJobsPerRun | quote }}
            - name: TERMIX_BSC_RPC_URL
              value: {{ .Values.termixProvider.rpcUrl | quote }}
          resources:
            {{- toYaml .Values.indexer.resources | nindent 12 }}
