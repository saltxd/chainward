apiVersion: batch/v1
kind: CronJob
metadata:
  name: decode-scout
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: chainward
    app.kubernetes.io/component: decode-scout
spec:
  schedule: "0 8 * * 1"            # Mon 08:00 — away from the 04-05/10:00 cron cluster
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 200
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # kube-router admits a new pod's IP into NetworkPolicy ipsets ~0.3-3 s after the pod
          # gets it. This init container (same pod IP) absorbs that window so the main container's
          # first connection is not refused. Always exits 0: a real outage is left to the main
          # container to report. See homelab-k3s docs/networkpolicy-map-2026-09-22.md.
          initContainers:
            - name: wait-for-deps
              image: busybox:1.36
              command: ["sh", "-c"]
              args:
                - 'end=$(( $(date +%s) + 60 )); n=0; until nc -z -w1 "$WAIT_HOST" "$WAIT_PORT"; do n=$((n+1)); if [ "$(date +%s)" -ge "$end" ]; then echo "wait-for-deps: $WAIT_HOST:$WAIT_PORT unreachable after 60s ($n tries), starting anyway"; exit 0; fi; sleep 1; done; echo "wait-for-deps: $WAIT_HOST:$WAIT_PORT reachable after $n failed tries"'
              env:
                - name: WAIT_HOST
                  value: postgres
                - name: WAIT_PORT
                  value: "5432"
              securityContext:
                runAsNonRoot: true
                runAsUser: 65534
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 50m
                  memory: 32Mi
          containers:
            - name: decode-scout
              image: {{ .Values.images.indexer }}
              imagePullPolicy: Always
              command: ["node", "dist/scout/index.js"]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: chainward-secrets
                      key: DATABASE_URL
                - name: SCOUT_DISCORD_WEBHOOK
                  valueFrom:
                    secretKeyRef:
                      name: chainward-secrets
                      key: SCOUT_DISCORD_WEBHOOK
                - name: OPS_DISCORD_WEBHOOK
                  valueFrom:
                    secretKeyRef:
                      name: chainward-secrets
                      key: PROBER_DISCORD_WEBHOOK   # reuse existing daily-ops webhook (no new secret value needed)
