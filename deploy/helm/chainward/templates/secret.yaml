{{/*
This is a placeholder to document the required secret structure.
The actual secret is created manually via kubectl to keep sensitive values out of git.

Optional keys (drop their lines from the command if unused):
  CDP_API_KEY_ID, CDP_API_KEY_SECRET
      x402 settles through the Coinbase CDP facilitator first when both are set.
  SELLER_DEMAND_RPC_URL, SELLER_DEMAND_BSC_RPC_URL
      Alchemy URLs for the x402 seller check. Unset, Base uses BASE_RPC_URL and
      BNB Chain is derived from the Base URL.

kubectl -n chainward create secret generic chainward-secrets \
  --from-literal=JWT_SECRET=<random-32-char-string> \
  --from-literal=ALCHEMY_API_KEY=<alchemy-key> \
  --from-literal=POSTGRES_PASSWORD=<strong-password> \
  --from-literal=DATABASE_URL=postgresql://chainward:<password>@postgres:5432/chainward \
  --from-literal=BASE_RPC_URL=http://<your-base-node-host>:8545 \
  --from-literal=BASE_RPC_FALLBACK_URL=https://base-mainnet.g.alchemy.com/v2/<alchemy-key> \
  --from-literal=TELEGRAM_BOT_TOKEN=<bot-token-from-botfather> \
  --from-literal=DIGEST_DISCORD_WEBHOOK=<discord-webhook-url> \
  --from-literal=CDP_API_KEY_ID=<cdp-api-key-id> \
  --from-literal=CDP_API_KEY_SECRET=<cdp-api-key-secret> \
  --from-literal=SELLER_DEMAND_RPC_URL=https://base-mainnet.g.alchemy.com/v2/<alchemy-key> \
  --from-literal=SELLER_DEMAND_BSC_RPC_URL=https://bnb-mainnet.g.alchemy.com/v2/<alchemy-key>
*/}}
