name: Build & Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

# runs queue per branch (a third push replaces the pending one); the bump action deploys only the branch head
concurrency: { group: "${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: false }   # queue, never cancel: a 25-min pipeline under frequent pushes would otherwise never deploy; the bump only deploys the branch head
jobs:
  check:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: chainward_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Catches the class of defect tsc does not: dead code, unused symbols,
      # case-block scope leaks. Errors fail the job; the 78 remaining
      # no-explicit-any findings are warnings (eslint still exits 0) because
      # they are a backlog to burn down, not a merge gate.
      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build

      # The api build regenerates the decode manifest from deliverables/. A diff
      # here means a decode was published without committing the manifest.
      - name: Decode manifest is committed
        run: git diff --exit-code -- apps/api/src/data/decode-manifest.json

      # Eval gate: decode unit + Layer A golden tests block the PR on regression.
      # The persist DB-integration suite runs against the postgres service via TEST_DB_URL
      # (self-contained migration 0014 applied in the test's beforeAll).
      - run: pnpm test
        env:
          TEST_DB_URL: postgres://test:test@localhost:5432/chainward_test

  # Images must boot, not just build: a Dockerfile that drops a runtime dep or an env var the config
  # schema requires still compiles. Each image runs against throwaway Postgres/Redis service containers
  # (host network) and must answer its liveness signal within 60 s. Same gha cache as the push job,
  # so the push job only re-tags.
  smoke:
    name: Smoke (images boot)
    needs: check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: smoke, POSTGRES_PASSWORD: smoke, POSTGRES_DB: smoke }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., file: apps/api/Dockerfile, load: true, tags: smoke/api:ci, cache-from: "type=gha,scope=chainward-api", cache-to: "type=gha,mode=max,scope=chainward-api" }
      - uses: docker/build-push-action@v6
        with: { context: ., file: apps/web/Dockerfile, load: true, tags: smoke/web:ci, cache-from: "type=gha,scope=chainward-web", cache-to: "type=gha,mode=max,scope=chainward-web" }
      - uses: docker/build-push-action@v6
        with: { context: ., file: packages/indexer/Dockerfile, load: true, tags: smoke/indexer:ci, cache-from: "type=gha,scope=chainward-indexer", cache-to: "type=gha,mode=max,scope=chainward-indexer" }
      - name: boot the three images
        shell: bash
        run: |
          set -euo pipefail
          # Throwaway values: the api only validates their shape at boot; the RPC URL points at a closed port.
          env_args=(-e NODE_ENV=production -e DATABASE_URL=postgres://smoke:smoke@127.0.0.1:5432/smoke -e REDIS_URL=redis://127.0.0.1:6379
                    -e "JWT_SECRET=$(head -c 48 /dev/urandom | base64 | tr -d '\n')" -e BASE_RPC_URL=http://127.0.0.1:9 -e ALCHEMY_WEBHOOK_SIGNING_KEY=smoke)
          docker run -d --name api --network host -e PORT=8000 "${env_args[@]}" smoke/api:ci
          # HOSTNAME=0.0.0.0: Next.js standalone binds to $HOSTNAME, and with --network host the runner's hostname leaks in.
          docker run -d --name web --network host -e PORT=3000 -e HOSTNAME=0.0.0.0 -e API_INTERNAL_URL=http://127.0.0.1:8000 smoke/web:ci
          docker run -d --name indexer --network host "${env_args[@]}" smoke/indexer:ci
          wait_for() { # name, check-command
            for i in $(seq 1 30); do if eval "$2" >/dev/null 2>&1; then echo "$1: up after ${i}x2s"; return 0; fi; sleep 2; done
            echo "::error::$1 did not come up in 60 s"; return 1
          }
          wait_for api     'curl -fsS http://127.0.0.1:8000/livez'
          wait_for web     'curl -fsS -o /dev/null http://127.0.0.1:3000/'
          # The indexer has no port; it writes a Redis heartbeat once every worker and schedule is registered.
          wait_for indexer 'test -n "$(docker run --rm --network host redis:7-alpine redis-cli get chainward:indexer:heartbeat)"'
      - name: container logs
        if: failure()
        run: for c in api web indexer; do echo "::group::$c"; docker logs "$c" 2>&1 | tail -80; echo "::endgroup::"; done

  # Public repo: a leaked key is world-readable the moment it is pushed. Scans the pushed commits (PR: the PR's).
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  docker:
    name: Build & Push Images
    needs: [check, smoke, gitleaks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: chainward-api
            context: .
            dockerfile: apps/api/Dockerfile
          - image: chainward-web
            context: .
            dockerfile: apps/web/Dockerfile
          - image: chainward-indexer
            context: .
            dockerfile: packages/indexer/Dockerfile
          - image: chainward-acp-decoder
            context: .
            dockerfile: apps/acp-decoder/Dockerfile
          # Migration runner + this commit's SQL; the chart's pre-upgrade hook runs it before the apps roll.
          - image: chainward-migrate
            context: .
            dockerfile: deploy/migrate.Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          build-args: |
            GIT_SHA=${{ steps.sha.outputs.short }}

  # Deploy = GitOps: commit the new tag for all five images into saltxd/homelab-k3s apps/chainward/helmrelease.yaml;
  # Flux runs the chart's pre-upgrade migration hook, then rolls api/web/indexer/acp-decoder. Rollback = revert that
  # commit (no automatic Helm rollback: revision 1 pins :latest). Never `kubectl set image` or `deploy/deploy.sh`
  # a rollout by hand any more: Flux drift detection reverts it.
  bump:
    name: Deploy (bump homelab-k3s)
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: { group: "bump-homelab-k3s-chainward", cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: saltxd/.github/.github/actions/bump-image@main
        with:
          image: "ghcr.io/saltxd/chainward-api,ghcr.io/saltxd/chainward-web,ghcr.io/saltxd/chainward-indexer,ghcr.io/saltxd/chainward-acp-decoder,ghcr.io/saltxd/chainward-migrate"
          tag: ${{ steps.sha.outputs.short }}
          file: apps/chainward/helmrelease.yaml
          kind: helm-values
          deploy-key: ${{ secrets.HOMELAB_K3S_DEPLOY_KEY }}

  # Sign in to production the way real users do, once Flux has rolled this commit's api: an EOA and an
  # undeployed Coinbase Smart Wallet (smart-wallet sign-in was broken for months while only EOAs were tested).
  # deploy.sh used to run this after every rollout; Flux replaced deploy.sh, so it runs here now.
  login-smoke:
    name: Login smoke (production)
    needs: bump
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      # The bump only deploys the branch head; a superseded run has nothing live to test.
      - id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/${GITHUB_REF#refs/heads/}" --jq .sha)
          if [ "$head" = "$GITHUB_SHA" ]; then echo "go=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::${GITHUB_SHA::7} was superseded by ${head::7}; that run's smoke covers it"; echo "go=false" >> "$GITHUB_OUTPUT"; fi
      - name: Wait for this commit's api to be live
        if: steps.head.outputs.go == 'true'
        env:
          WANT: ${{ steps.sha.outputs.short }}
        run: |
          for _ in $(seq 1 60); do
            live=$(curl -fsS https://api.chainward.ai/api/health | jq -r '.version // empty' || true)
            if [ "$live" = "$WANT" ]; then echo "api live at $live"; exit 0; fi
            echo "live: ${live:-unknown}, waiting for $WANT"
            sleep 15
          done
          echo "::error::api never reported $WANT within 15 minutes; check the Flux HelmRelease"
          exit 1
      - if: steps.head.outputs.go == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.head.outputs.go == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.head.outputs.go == 'true'
        run: pnpm install --frozen-lockfile
      - name: Sign in with an EOA and a smart wallet
        if: steps.head.outputs.go == 'true'
        run: pnpm --filter @chainward/api exec tsx scripts/login-smoke.mts

