name: Publish packages

# Publishes any workspace package whose version in package.json is not yet on
# npm. Bumping a version and merging to main is the whole release process.
#
# Auth is npm Trusted Publishing (OIDC): no NPM_TOKEN, nothing to expire or
# leak. Each package must be configured once on npmjs.com under
# Settings > Trusted Publisher, pointing at this repo and this workflow
# filename. A package that has not been configured is skipped with a warning
# rather than failing the run, so adding them can be done one at a time.

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - '.github/workflows/publish-packages.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List what would publish, publish nothing'
        type: boolean
        default: false

concurrency:
  group: publish-packages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Node 22 ships npm 10; OIDC Trusted Publishing needs >= 11.5.1.
      - name: Upgrade npm for OIDC support
        run: |
          npm install -g npm@latest
          echo "npm $(npm --version)"

      - run: pnpm install --frozen-lockfile

      - name: Publish changed packages
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          published=0
          skipped=0
          failed=0

          for dir in packages/*/; do
            [ -f "${dir}package.json" ] || continue

            name=$(node -p "require('./${dir}package.json').name")
            is_private=$(node -p "!!require('./${dir}package.json').private")
            [ "$is_private" = "true" ] && continue

            local_v=$(node -p "require('./${dir}package.json').version")
            pub_v=$(npm view "$name" version 2>/dev/null || echo "none")

            if [ "$local_v" = "$pub_v" ]; then
              echo "= $name@$local_v already on npm"
              skipped=$((skipped+1))
              continue
            fi

            echo "::group::$name  $pub_v -> $local_v"

            # Build, and run the package's own tests when it has some.
            pnpm --filter "$name" build
            if node -e "process.exit(require('./${dir}package.json').scripts?.test ? 0 : 1)"; then
              pnpm --filter "$name" test
            fi

            if [ "${DRY_RUN:-false}" = "true" ]; then
              echo "dry run: would publish $name@$local_v"
              (cd "$dir" && npm publish --access public --dry-run)
            else
              # A package without a Trusted Publisher configured fails here.
              # Warn and carry on so the rest of the matrix still ships.
              if (cd "$dir" && npm publish --access public); then
                echo "published $name@$local_v"
                published=$((published+1))
              else
                echo "::warning title=Publish failed::$name@$local_v did not publish. If this is the first run, add a Trusted Publisher for it on npmjs.com pointing at this repo and publish-packages.yml."
                failed=$((failed+1))
              fi
            fi

            echo "::endgroup::"
          done

          echo "published=$published skipped=$skipped failed=$failed" >> "$GITHUB_STEP_SUMMARY"
          echo "published=$published skipped=$skipped failed=$failed"
          [ "$failed" -eq 0 ]
